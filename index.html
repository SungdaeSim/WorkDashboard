<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>팀 업무 배분 매트릭스</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const STORAGE_KEY = "work-matrix-data-v4";
const UNASSIGNED = "";
const EDIT_PASSWORD = "1234"; // 배포 전 반드시 변경하세요

const STATUS_OPTIONS = [
  { value: "pending", label: "대기" },
  { value: "in_progress", label: "진행중" },
  { value: "done", label: "완료" },
];

const STATUS_META = {
  pending: { label: "대기", badgeClass: "bg-slate-100 text-slate-500", borderClass: "border-l-slate-300" },
  in_progress: { label: "진행중", badgeClass: "bg-amber-50 text-amber-600", borderClass: "border-l-amber-400" },
  done: { label: "완료", badgeClass: "bg-emerald-50 text-emerald-600", borderClass: "border-l-emerald-400" },
};

function statusMeta(status) {
  return STATUS_META[status] || STATUS_META.pending;
}

function getTodayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
const TODAY = getTodayStr();

function isOverdue(task) {
  return task.status !== "done" && task.endDate < TODAY;
}

const INITIAL_MEMBERS = [
  { id: "m1", name: "김철수" },
  { id: "m2", name: "이영희" },
  { id: "m3", name: "박민수" },
];

const INITIAL_PROJECTS = [
  { id: "p1", name: "자율주행 모빌리티 엑스포" },
  { id: "p2", name: "커넥티드 카 서비스 기획" },
  { id: "p3", name: "팀 공통(총무)" },
];

const INITIAL_TASKS = [
  {
    id: "t1",
    title: "부스 기획 및 운영안 작성",
    projectId: "p1",
    assignee: "m1",
    startDate: "2026-08-01",
    endDate: "2026-08-14",
    status: "done",
  },
  {
    id: "t2",
    title: "텔레매틱스 기반 고객 데이터 분석",
    projectId: "p2",
    assignee: "m2",
    startDate: "2026-08-20",
    endDate: "2026-09-10",
    status: "pending",
  },
  {
    id: "t3",
    title: "월간 법인카드 사용 내역 정산",
    projectId: "p3",
    assignee: "m3",
    startDate: "2026-08-25",
    endDate: "2026-08-31",
    status: "pending",
  },
];

function loadInitialState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.tasks) && Array.isArray(parsed.members) && Array.isArray(parsed.projects)) {
        return parsed;
      }
    }
  } catch (e) {
    console.warn("저장된 데이터를 불러오지 못했습니다.", e);
  }
  return { members: INITIAL_MEMBERS, projects: INITIAL_PROJECTS, tasks: INITIAL_TASKS };
}

function formatDateRange(start, end) {
  return `${start} ~ ${end}`;
}

function TaskFormModal({ members, projects, task, onClose, onSave, onDelete }) {
  const isEditing = Boolean(task);
  const [title, setTitle] = useState(task?.title || "");
  const [projectId, setProjectId] = useState(task?.projectId || projects[0]?.id || "");
  const [assignee, setAssignee] = useState(task ? task.assignee : (members[0]?.id || UNASSIGNED));
  const [startDate, setStartDate] = useState(task?.startDate || "");
  const [endDate, setEndDate] = useState(task?.endDate || "");
  const [status, setStatus] = useState(task?.status || "pending");
  const [error, setError] = useState("");

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!title.trim() || !projectId || !startDate || !endDate) {
      setError("모든 항목을 입력해 주세요.");
      return;
    }
    if (startDate > endDate) {
      setError("시작일은 마감일보다 이전이어야 합니다.");
      return;
    }
    onSave({
      id: task?.id || `t${Date.now()}`,
      title: title.trim(),
      projectId,
      assignee,
      startDate,
      endDate,
      status,
    });
  };

  return (
    <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
      <div className="bg-white rounded-xl shadow-xl w-full max-w-md p-6">
        <div className="flex items-center justify-between mb-4">
          <h2 className="text-lg font-semibold text-slate-800">{isEditing ? "업무 수정" : "새 업무 추가"}</h2>
          <button
            onClick={onClose}
            className="text-slate-400 hover:text-slate-600 text-xl leading-none"
            aria-label="닫기"
          >
            &times;
          </button>
        </div>
        <form onSubmit={handleSubmit} className="space-y-4">
          <div>
            <label className="block text-sm font-medium text-slate-600 mb-1">업무명</label>
            <input
              type="text"
              value={title}
              onChange={(e) => setTitle(e.target.value)}
              className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
              placeholder="예: 주간 보고서 작성"
            />
          </div>
          <div>
            <label className="block text-sm font-medium text-slate-600 mb-1">과제명</label>
            <select
              value={projectId}
              onChange={(e) => setProjectId(e.target.value)}
              className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
            >
              {projects.map((p) => (
                <option key={p.id} value={p.id}>{p.name}</option>
              ))}
            </select>
          </div>
          <div>
            <label className="block text-sm font-medium text-slate-600 mb-1">담당자</label>
            <select
              value={assignee}
              onChange={(e) => setAssignee(e.target.value)}
              className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
            >
              <option value={UNASSIGNED}>담당자 미지정</option>
              {members.map((m) => (
                <option key={m.id} value={m.id}>{m.name}</option>
              ))}
            </select>
          </div>
          <div>
            <label className="block text-sm font-medium text-slate-600 mb-1">상태</label>
            <div className="flex gap-2">
              {STATUS_OPTIONS.map((opt) => (
                <button
                  key={opt.value}
                  type="button"
                  onClick={() => setStatus(opt.value)}
                  className={`flex-1 text-sm font-medium px-3 py-2 rounded-lg border transition-colors ${
                    status === opt.value
                      ? "border-indigo-400 bg-indigo-50 text-indigo-700"
                      : "border-slate-300 text-slate-500 hover:bg-slate-50"
                  }`}
                >
                  {opt.label}
                </button>
              ))}
            </div>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="block text-sm font-medium text-slate-600 mb-1">시작일</label>
              <input
                type="date"
                value={startDate}
                onChange={(e) => setStartDate(e.target.value)}
                className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
              />
            </div>
            <div>
              <label className="block text-sm font-medium text-slate-600 mb-1">마감일</label>
              <input
                type="date"
                value={endDate}
                onChange={(e) => setEndDate(e.target.value)}
                className="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
              />
            </div>
          </div>
          {error && <p className="text-sm text-red-500">{error}</p>}
          <div className="flex items-center justify-between gap-2 pt-2">
            {isEditing ? (
              <button
                type="button"
                onClick={() => onDelete(task.id)}
                className="px-3 py-2 text-sm rounded-lg border border-red-200 text-red-600 hover:bg-red-50"
              >
                삭제
              </button>
            ) : <span />}
            <div className="flex gap-2">
              <button
                type="button"
                onClick={onClose}
                className="px-4 py-2 text-sm rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-50"
              >
                취소
              </button>
              <button
                type="submit"
                className="px-4 py-2 text-sm rounded-lg bg-indigo-600 text-white hover:bg-indigo-700"
              >
                저장
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  );
}

function TaskCard({ task, onDragStart, onEdit }) {
  const meta = statusMeta(task.status);
  const overdue = isOverdue(task);
  const borderClass = overdue ? "border-l-red-500" : meta.borderClass;
  const badgeClass = overdue ? "bg-red-50 text-red-600" : meta.badgeClass;
  const dateClass = overdue ? "text-red-500 font-medium" : "text-slate-400";
  return (
    <div
      draggable
      onDragStart={(e) => onDragStart(e, task.id)}
      onDoubleClick={() => onEdit(task)}
      title="더블클릭하여 수정"
      className={`bg-white rounded-lg shadow-sm border border-slate-200 border-l-4 ${borderClass} px-3 py-2 mb-2 cursor-grab active:cursor-grabbing hover:shadow-md transition-shadow`}
    >
      <p className="text-sm font-medium text-slate-800 leading-snug">{task.title}</p>
      <div className="flex items-center justify-between mt-1.5 gap-2">
        <p className={`text-xs ${dateClass}`}>{formatDateRange(task.startDate, task.endDate)}</p>
        <span className={`shrink-0 text-[10px] font-medium px-1.5 py-0.5 rounded-full ${badgeClass}`}>
          {meta.label}
        </span>
      </div>
    </div>
  );
}

function MatrixCell({ projectId, member, tasks, onDragStart, onDrop, onEditTask }) {
  const [isOver, setIsOver] = useState(false);

  const handleDragOver = (e) => {
    e.preventDefault();
    if (!isOver) setIsOver(true);
  };

  const handleDragLeave = () => setIsOver(false);

  const handleDrop = (e) => {
    e.preventDefault();
    setIsOver(false);
    const taskId = e.dataTransfer.getData("text/plain");
    onDrop(taskId, projectId, member);
  };

  return (
    <td
      onDragOver={handleDragOver}
      onDragLeave={handleDragLeave}
      onDrop={handleDrop}
      className={`align-top border border-slate-200 p-2 min-w-[200px] w-[220px] transition-colors ${
        isOver ? "bg-indigo-50" : "bg-white"
      }`}
    >
      <div className="min-h-[64px]">
        {tasks.map((task) => (
          <TaskCard key={task.id} task={task} onDragStart={onDragStart} onEdit={onEditTask} />
        ))}
      </div>
    </td>
  );
}

function ProjectRowHeader({ project, isEditUnlocked, onRename, onDelete, onReorder }) {
  const [isOver, setIsOver] = useState(false);

  const handleDragStart = (e) => {
    e.dataTransfer.setData("application/x-project-id", project.id);
    e.dataTransfer.effectAllowed = "move";
  };

  const handleDragOver = (e) => {
    if (!e.dataTransfer.types.includes("application/x-project-id")) return;
    e.preventDefault();
    if (!isOver) setIsOver(true);
  };

  const handleDragLeave = () => setIsOver(false);

  const handleDrop = (e) => {
    if (!e.dataTransfer.types.includes("application/x-project-id")) return;
    e.preventDefault();
    setIsOver(false);
    const draggedId = e.dataTransfer.getData("application/x-project-id");
    if (draggedId) onReorder(draggedId, project.id);
  };

  return (
    <th
      onDragOver={isEditUnlocked ? handleDragOver : undefined}
      onDragLeave={isEditUnlocked ? handleDragLeave : undefined}
      onDrop={isEditUnlocked ? handleDrop : undefined}
      className={`border border-slate-200 p-2 text-left text-sm font-semibold text-slate-600 align-top sticky left-0 z-10 transition-colors ${
        isOver ? "bg-indigo-50" : "bg-slate-50"
      }`}
    >
      {isEditUnlocked ? (
        <div className="flex items-start gap-1">
          <span
            draggable
            onDragStart={handleDragStart}
            className="shrink-0 mt-0.5 text-slate-400 hover:text-slate-600 cursor-grab active:cursor-grabbing select-none text-xs leading-none"
            title="드래그하여 순서 변경"
            aria-label="드래그하여 순서 변경"
          >
            ⠿
          </span>
          <input
            type="text"
            value={project.name}
            onChange={(e) => onRename(project.id, e.target.value)}
            className="w-full bg-transparent border border-transparent hover:border-slate-300 focus:border-indigo-400 focus:bg-white rounded px-1 py-0.5 text-sm font-semibold text-slate-600 focus:outline-none"
          />
          <button
            onClick={() => onDelete(project.id)}
            className="shrink-0 mt-0.5 text-slate-300 hover:text-red-500 text-xs leading-none"
            title={`${project.name} 삭제`}
            aria-label={`${project.name} 삭제`}
          >
            ✕
          </button>
        </div>
      ) : (
        <span className="px-1 py-0.5">{project.name}</span>
      )}
    </th>
  );
}

function App() {
  const initial = useRef(loadInitialState());
  const [members, setMembers] = useState(initial.current.members);
  const [projects, setProjects] = useState(initial.current.projects);
  const [tasks, setTasks] = useState(initial.current.tasks);
  const [isModalOpen, setIsModalOpen] = useState(false);
  const [editingTask, setEditingTask] = useState(null);
  const [newMemberName, setNewMemberName] = useState("");
  const [newProjectName, setNewProjectName] = useState("");
  const [isEditUnlocked, setIsEditUnlocked] = useState(false);
  const [projectFilter, setProjectFilter] = useState("all");
  const [memberFilter, setMemberFilter] = useState("all");
  const [statusFilters, setStatusFilters] = useState([]);

  useEffect(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ members, projects, tasks }));
  }, [members, projects, tasks]);

  const handleDragStart = (e, taskId) => {
    e.dataTransfer.setData("text/plain", taskId);
    e.dataTransfer.effectAllowed = "move";
  };

  const handleDrop = (taskId, projectId, member) => {
    setTasks((prev) =>
      prev.map((t) =>
        t.id === taskId ? { ...t, projectId, assignee: member } : t
      )
    );
  };

  const handleOpenCreateModal = () => {
    setEditingTask(null);
    setIsModalOpen(true);
  };

  const handleOpenEditModal = (task) => {
    setEditingTask(task);
    setIsModalOpen(true);
  };

  const handleSaveTask = (taskData) => {
    setTasks((prev) => {
      const exists = prev.some((t) => t.id === taskData.id);
      return exists ? prev.map((t) => (t.id === taskData.id ? taskData : t)) : [...prev, taskData];
    });
    setIsModalOpen(false);
    setEditingTask(null);
  };

  const handleDeleteTask = (taskId) => {
    const task = tasks.find((t) => t.id === taskId);
    if (!task) return;
    const confirmed = window.confirm(`'${task.title}' 업무를 삭제하시겠습니까?`);
    if (!confirmed) return;
    setTasks((prev) => prev.filter((t) => t.id !== taskId));
    setIsModalOpen(false);
    setEditingTask(null);
  };

  const handleToggleEditLock = () => {
    if (isEditUnlocked) {
      setIsEditUnlocked(false);
      return;
    }
    const input = window.prompt("담당자/과제 편집을 위한 비밀번호를 입력하세요.");
    if (input === null) return;
    if (input === EDIT_PASSWORD) {
      setIsEditUnlocked(true);
    } else {
      alert("비밀번호가 올바르지 않습니다.");
    }
  };

  const handleAddMember = (e) => {
    e.preventDefault();
    const name = newMemberName.trim();
    if (!name) return;
    if (members.some((m) => m.name === name)) {
      alert("이미 존재하는 담당자입니다.");
      return;
    }
    setMembers((prev) => [...prev, { id: `m${Date.now()}`, name }]);
    setNewMemberName("");
  };

  const handleRenameMember = (memberId, name) => {
    setMembers((prev) =>
      prev.map((m) => (m.id === memberId ? { ...m, name } : m))
    );
  };

  const handleDeleteMember = (memberId) => {
    const member = members.find((m) => m.id === memberId);
    if (!member) return;
    const confirmed = window.confirm(
      `'${member.name}' 담당자를 삭제하시겠습니까?\n담당하던 업무는 '담당자 미지정'으로 이동합니다.`
    );
    if (!confirmed) return;
    setMembers((prev) => prev.filter((m) => m.id !== memberId));
    setTasks((prev) =>
      prev.map((t) => (t.assignee === memberId ? { ...t, assignee: UNASSIGNED } : t))
    );
    if (memberFilter === memberId) setMemberFilter("all");
  };

  const handleAddProject = (e) => {
    e.preventDefault();
    const name = newProjectName.trim();
    if (!name) return;
    setProjects((prev) => [...prev, { id: `p${Date.now()}`, name }]);
    setNewProjectName("");
  };

  const handleRenameProject = (projectId, name) => {
    setProjects((prev) =>
      prev.map((p) => (p.id === projectId ? { ...p, name } : p))
    );
  };

  const handleDeleteProject = (projectId) => {
    const project = projects.find((p) => p.id === projectId);
    if (!project) return;
    const affectedCount = tasks.filter((t) => t.projectId === projectId).length;
    const warning = affectedCount > 0
      ? `\n이 과제에 속한 업무 ${affectedCount}개도 함께 삭제됩니다.`
      : "";
    const confirmed = window.confirm(`'${project.name}' 과제를 삭제하시겠습니까?${warning}`);
    if (!confirmed) return;
    setProjects((prev) => prev.filter((p) => p.id !== projectId));
    setTasks((prev) => prev.filter((t) => t.projectId !== projectId));
    if (projectFilter === projectId) setProjectFilter("all");
  };

  const handleReorderProjects = (draggedId, targetId) => {
    if (draggedId === targetId) return;
    setProjects((prev) => {
      const fromIndex = prev.findIndex((p) => p.id === draggedId);
      const toIndex = prev.findIndex((p) => p.id === targetId);
      if (fromIndex === -1 || toIndex === -1) return prev;
      const updated = [...prev];
      const [moved] = updated.splice(fromIndex, 1);
      updated.splice(toIndex, 0, moved);
      return updated;
    });
  };

  const visibleProjects = projectFilter === "all" ? projects : projects.filter((p) => p.id === projectFilter);
  const visibleMembers = memberFilter === "all"
    ? members
    : memberFilter === UNASSIGNED
      ? []
      : members.filter((m) => m.id === memberFilter);
  const showUnassignedColumn = memberFilter === "all" || memberFilter === UNASSIGNED;
  const isFiltered = projectFilter !== "all" || memberFilter !== "all" || statusFilters.length > 0;
  const totalColumns = 1 + visibleMembers.length + (showUnassignedColumn ? 1 : 0) + 1;

  const matchesStatusFilter = (task) =>
    statusFilters.length === 0
      ? true
      : statusFilters.some((f) => (f === "overdue" ? isOverdue(task) : task.status === f));

  const toggleStatusFilter = (value) => {
    setStatusFilters((prev) =>
      prev.includes(value) ? prev.filter((v) => v !== value) : [...prev, value]
    );
  };

  const statusLegendOptions = [
    ...STATUS_OPTIONS.map((opt) => ({ value: opt.value, label: opt.label, badgeClass: STATUS_META[opt.value].badgeClass })),
    { value: "overdue", label: "지연", badgeClass: "bg-red-50 text-red-600" },
  ];

  return (
    <div className="max-w-7xl mx-auto px-6 py-8">
      <div className="flex items-center justify-between mb-6">
        <div>
          <h1 className="text-2xl font-bold text-slate-800">팀 업무 배분 매트릭스</h1>
          <p className="text-sm text-slate-500 mt-1">팀원별 · 과제별 업무를 한눈에 확인하고 드래그로 재배치하세요.</p>
        </div>
        <div className="flex items-center gap-2">
          <button
            onClick={handleToggleEditLock}
            className={`text-sm font-medium px-4 py-2 rounded-lg border ${
              isEditUnlocked
                ? "border-indigo-300 text-indigo-600 bg-indigo-50 hover:bg-indigo-100"
                : "border-slate-300 text-slate-600 bg-white hover:bg-slate-50"
            }`}
          >
            {isEditUnlocked ? "🔓 담당자/과제 편집 잠금" : "🔒 담당자/과제 편집 잠금 해제"}
          </button>
          <button
            onClick={handleOpenCreateModal}
            className="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-lg shadow-sm"
          >
            + 새 업무 추가
          </button>
        </div>
      </div>

      <div className="flex flex-wrap items-center gap-3 mb-4">
        <div className="flex items-center gap-2">
          <label className="text-xs font-medium text-slate-500">과제</label>
          <select
            value={projectFilter}
            onChange={(e) => setProjectFilter(e.target.value)}
            className="border border-slate-300 rounded-lg px-2 py-1.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400"
          >
            <option value="all">전체 과제</option>
            {projects.map((p) => (
              <option key={p.id} value={p.id}>{p.name}</option>
            ))}
          </select>
        </div>
        <div className="flex items-center gap-2">
          <label className="text-xs font-medium text-slate-500">담당자</label>
          <select
            value={memberFilter}
            onChange={(e) => setMemberFilter(e.target.value)}
            className="border border-slate-300 rounded-lg px-2 py-1.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400"
          >
            <option value="all">전체 담당자</option>
            {members.map((m) => (
              <option key={m.id} value={m.id}>{m.name}</option>
            ))}
            <option value={UNASSIGNED}>담당자 미지정</option>
          </select>
        </div>
        {isFiltered && (
          <button
            onClick={() => { setProjectFilter("all"); setMemberFilter("all"); setStatusFilters([]); }}
            className="text-xs text-indigo-600 hover:underline"
          >
            필터 초기화
          </button>
        )}
        <div className="flex items-center gap-1.5 ml-auto">
          <span className="text-xs text-slate-400 mr-1">상태</span>
          {statusLegendOptions.map((opt) => (
            <button
              key={opt.value}
              type="button"
              onClick={() => toggleStatusFilter(opt.value)}
              title={`${opt.label} 상태 ${statusFilters.includes(opt.value) ? "필터 해제" : "필터링(중복 선택 가능)"}`}
              className={`text-[10px] font-medium px-1.5 py-0.5 rounded-full transition-opacity ${opt.badgeClass} ${
                statusFilters.includes(opt.value)
                  ? "ring-2 ring-offset-1 ring-indigo-400"
                  : statusFilters.length > 0
                    ? "opacity-40 hover:opacity-70"
                    : "hover:opacity-80"
              }`}
            >
              {opt.label}
            </button>
          ))}
        </div>
      </div>

      <div className="overflow-x-auto bg-white rounded-xl shadow-sm border border-slate-200">
        <table className="border-collapse w-full">
          <thead>
            <tr>
              <th className="border border-slate-200 bg-slate-50 p-3 text-left text-sm font-semibold text-slate-600 min-w-[200px] sticky left-0 z-10">
                과제 \ 담당자
              </th>
              {visibleMembers.map((member) => (
                <th
                  key={member.id}
                  className="border border-slate-200 bg-slate-50 p-3 text-center text-sm font-semibold text-slate-600 min-w-[220px]"
                >
                  {isEditUnlocked ? (
                    <div className="flex items-center justify-center gap-2">
                      <input
                        type="text"
                        value={member.name}
                        onChange={(e) => handleRenameMember(member.id, e.target.value)}
                        className="w-24 bg-transparent border border-transparent hover:border-slate-300 focus:border-indigo-400 focus:bg-white rounded px-1 py-0.5 text-sm font-semibold text-slate-600 text-center focus:outline-none"
                      />
                      <button
                        onClick={() => handleDeleteMember(member.id)}
                        className="text-slate-300 hover:text-red-500 text-xs leading-none"
                        title={`${member.name} 삭제`}
                        aria-label={`${member.name} 삭제`}
                      >
                        ✕
                      </button>
                    </div>
                  ) : (
                    <span>{member.name}</span>
                  )}
                </th>
              ))}
              {showUnassignedColumn && (
                <th className="border border-slate-200 bg-slate-100 p-3 text-center text-sm font-semibold text-slate-500 italic min-w-[220px]">
                  담당자 미지정
                </th>
              )}
              <th className="border border-slate-200 bg-slate-50 p-3 text-center min-w-[160px]">
                {isEditUnlocked ? (
                  <form onSubmit={handleAddMember} className="flex items-center justify-center gap-1">
                    <input
                      type="text"
                      value={newMemberName}
                      onChange={(e) => setNewMemberName(e.target.value)}
                      placeholder="담당자 이름"
                      className="w-24 border border-slate-300 rounded-lg px-2 py-1 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-400"
                    />
                    <button
                      type="submit"
                      className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium px-2 py-1 rounded-lg"
                    >
                      추가
                    </button>
                  </form>
                ) : (
                  <span className="text-xs text-slate-400">🔒 잠금됨</span>
                )}
              </th>
            </tr>
          </thead>
          <tbody>
            {visibleProjects.map((project) => {
              const unassignedTasks = tasks.filter(
                (t) =>
                  t.projectId === project.id &&
                  (!t.assignee || !members.some((m) => m.id === t.assignee)) &&
                  matchesStatusFilter(t)
              );
              return (
                <tr key={project.id}>
                  <ProjectRowHeader
                    project={project}
                    isEditUnlocked={isEditUnlocked}
                    onRename={handleRenameProject}
                    onDelete={handleDeleteProject}
                    onReorder={handleReorderProjects}
                  />
                  {visibleMembers.map((member) => {
                    const cellTasks = tasks.filter(
                      (t) => t.projectId === project.id && t.assignee === member.id && matchesStatusFilter(t)
                    );
                    return (
                      <MatrixCell
                        key={`${project.id}-${member.id}`}
                        projectId={project.id}
                        member={member.id}
                        tasks={cellTasks}
                        onDragStart={handleDragStart}
                        onDrop={handleDrop}
                        onEditTask={handleOpenEditModal}
                      />
                    );
                  })}
                  {showUnassignedColumn && (
                    <MatrixCell
                      key={`${project.id}-unassigned`}
                      projectId={project.id}
                      member={UNASSIGNED}
                      tasks={unassignedTasks}
                      onDragStart={handleDragStart}
                      onDrop={handleDrop}
                      onEditTask={handleOpenEditModal}
                    />
                  )}
                  <td className="border border-slate-200 bg-slate-50"></td>
                </tr>
              );
            })}
            <tr>
              <td colSpan={totalColumns} className="border border-slate-200 bg-slate-50 p-2">
                {isEditUnlocked ? (
                  <form onSubmit={handleAddProject} className="flex items-center gap-2">
                    <input
                      type="text"
                      value={newProjectName}
                      onChange={(e) => setNewProjectName(e.target.value)}
                      placeholder="새 과제명"
                      className="w-56 border border-slate-300 rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
                    />
                    <button
                      type="submit"
                      className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium px-3 py-1.5 rounded-lg"
                    >
                      + 과제 추가
                    </button>
                  </form>
                ) : (
                  <span className="text-xs text-slate-400">🔒 담당자/과제 편집이 잠겨 있습니다. 편집하려면 잠금을 해제하세요.</span>
                )}
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      {isModalOpen && (
        <TaskFormModal
          members={members}
          projects={projects}
          task={editingTask}
          onClose={() => { setIsModalOpen(false); setEditingTask(null); }}
          onSave={handleSaveTask}
          onDelete={handleDeleteTask}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
